<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            grid-column: 1 / 4;
            background-color: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        aside {
            background-color: #333;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 5px;
        }

        main {
            grid-column: 2 / 4;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px gray;
        }

        .box:first-child {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header,
            main,
            aside {
                grid-column: 1;
            }

            main {
                grid-template-columns: 1fr;
            }

            .box:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header>
            <h1>My Dashboard</h1>
        </header>

        <aside>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </aside>

        <main>

            <div class="box">
                <h2>Total Projects</h2>
                <p>25 Projects</p>
            </div>

            <div class="box">
                <h2>Completed</h2>
                <p>18 Projects</p>
            </div>

            <div class="box">
                <h2>Pending</h2>
                <p>7 Projects</p>
            </div>

        </main>

    </div>

</body>
</html>
