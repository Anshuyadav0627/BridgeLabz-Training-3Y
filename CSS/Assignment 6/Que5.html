<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .plans {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .card {
            flex: 1;
            padding: 30px;
            background-color: white;
            border: 2px solid #aaa;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
            animation: show 1s;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .middle {
            background-color: #dbeafe;
            transform: scale(1.05);
            border: 3px solid blue;
        }

        @keyframes show {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 750px) {
            .plans {
                flex-direction: column;
            }

            .middle {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <h1>Pricing Plans</h1>

    <div class="plans">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>5 Projects</p>
            <p>Email Support</p>
        </div>

        <div class="card middle">
            <h2>Standard</h2>
            <h3>₹999</h3>
            <p>15 Projects</p>
            <p>Priority Support</p>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹1499</h3>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
        </div>

    </div>

</body>
</html>
