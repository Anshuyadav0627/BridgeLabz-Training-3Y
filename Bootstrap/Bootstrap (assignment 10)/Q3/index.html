<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-light text-center py-4">
  <h1>Everyday Essentials Store</h1>
</header>

<main class="container my-5">
  <!-- 4 columns on desktop (col-md-3), 2 on tablet (col-sm-6), 1 on mobile (col-12) -->
  <div class="row g-4">

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Wireless headphones">
        <div class="card-body text-center">
          <h5 class="card-title">Wireless Headphones</h5>
          <p class="card-text">$49.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Smart watch">
        <div class="card-body text-center">
          <h5 class="card-title">Smart Watch</h5>
          <p class="card-text">$89.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Backpack">
        <div class="card-body text-center">
          <h5 class="card-title">Travel Backpack</h5>
          <p class="card-text">$34.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Water bottle">
        <div class="card-body text-center">
          <h5 class="card-title">Steel Water Bottle</h5>
          <p class="card-text">$14.99</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="bg-dark text-light text-center py-3">
  <p class="mb-0">&copy; 2026 Everyday Essentials Store</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
