<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial;
            background-color: #eeeeee;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        figure {
            margin: 0;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
            overflow: hidden;
        }

        figure img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        figure img:hover {
            transform: scale(1.1);
        }

        figcaption {
            padding: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="photo1.jpg" alt="Nature">
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <img src="photo2.jpg" alt="Mountain">
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <img src="photo3.jpg" alt="Beach">
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <img src="photo4.jpg" alt="City">
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <img src="photo5.jpg" alt="Forest">
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <img src="photo6.jpg" alt="Sunset">
            <figcaption>Sunset</figcaption>
        </figure>

    </div>

</body>
</html>
