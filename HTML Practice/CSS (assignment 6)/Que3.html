<!DOCTYPE html>
<html>
<head>
    <title>My Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1e3a5f;
            color: white;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 30px;
        }

        .box {
            flex: 1;
            padding: 50px 20px;
            text-align: center;
            background-color: #dbeafe;
            border-radius: 10px;
            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="box">
            <h2>Services</h2>
            <p>Web development and other services.</p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>My recent college projects.</p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>Contact me for more information.</p>
        </div>

    </main>

    <footer>
        <p>© 2026 My Homepage</p>
    </footer>

</body>
</html>
