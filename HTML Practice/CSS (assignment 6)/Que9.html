<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background-color: #eeeeee;
        }

        .card {
            width: 300px;
            height: 350px;
            perspective: 1000px;
        }

        .inside {
            width: 100%;
            height: 100%;
            position: relative;
            transition: 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .inside {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px gray;
        }

        .front {
            background-color: white;
        }

        .front img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }

        .back {
            background-color: #1e3a5f;
            color: white;
            transform: rotateY(180deg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="inside">

            <div class="front">
                <img src="profile.jpg" alt="Profile">
                <h2>Anshu Yadav</h2>
            </div>

            <div class="back">
                <p>
                    I am a Computer Science student interested in
                    programming, cybersecurity and technology.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
