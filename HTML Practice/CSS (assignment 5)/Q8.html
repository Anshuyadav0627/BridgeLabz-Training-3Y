<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: #1e3a5f;
            color: white;
            padding: 10px 30px;
        }

        .layout {
            display: flex;
            padding-top: 70px;
            min-height: 100vh;
        }

        aside {
            width: 220px;
            min-height: calc(100vh - 70px);
            background-color: #333;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
        }

        aside a:hover {
            background-color: #555;
        }

        main {
            flex: 1;
            padding: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            flex: 1;
            min-width: 200px;
            padding: 30px;
            background-color: white;
            box-shadow: 0 3px 10px gray;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .layout {
                flex-direction: column;
            }

            aside {
                width: 100%;
                min-height: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="layout">

        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </aside>

        <main>

            <div class="box">
                <h2>Total Projects</h2>
                <p>20</p>
            </div>

            <div class="box">
                <h2>Completed Tasks</h2>
                <p>50</p>
            </div>

            <div class="box">
                <h2>Pending Tasks</h2>
                <p>10</p>
            </div>

        </main>

    </div>

</body>
</html>
