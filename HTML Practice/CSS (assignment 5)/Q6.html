<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial;
            background-color: #eeeeee;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: 0.3s;
        }

        .photo span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            opacity: 0;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover span {
            opacity: 1;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="photo1.jpg" alt="Nature">
            <span>Nature</span>
        </div>

        <div class="photo">
            <img src="photo2.jpg" alt="Mountain">
            <span>Mountain</span>
        </div>

        <div class="photo">
            <img src="photo3.jpg" alt="Beach">
            <span>Beach</span>
        </div>

        <div class="photo">
            <img src="photo4.jpg" alt="City">
            <span>City</span>
        </div>

        <div class="photo">
            <img src="photo5.jpg" alt="Forest">
            <span>Forest</span>
        </div>

        <div class="photo">
            <img src="photo6.jpg" alt="Sunset">
            <span>Sunset</span>
        </div>

    </div>

</body>
</html>
