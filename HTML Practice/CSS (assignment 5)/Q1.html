<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
            color: #222;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #1e3a5f;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding-top: 140px;
            min-height: 70vh;
        }

        .intro {
            width: 80%;
            margin: auto;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .intro p {
            width: 30em;
            font-size: 1.1rem;
        }

        .intro img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        footer {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Anshu Yadav</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">

        <div class="intro">
            <div>
                <h2>Hello, I am Anshu</h2>
                <p>
                    I am a Computer Science student. I like learning
                    programming and new technologies.
                </p>
            </div>

            <img src="profile.jpg" alt="My Profile">
        </div>

        <section id="about">
            <h2>About Me</h2>
            <p>
                I am interested in Java, Python, Cybersecurity and Web Development.
            </p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Email: anshu@example.com</p>
            <p>Phone: 9876543210</p>
        </section>

    </main>

    <footer>
        <p>© 2026 Anshu Yadav</p>
    </footer>

</body>
</html>
