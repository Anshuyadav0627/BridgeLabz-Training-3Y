<!DOCTYPE html>
<html>
<head>
    <title>CSS Animations</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .box {
            width: 80px;
            height: 80px;
            background-color: #3498db;
        }

        /* Moving animation */
        .move {
            animation: moveBox 2s ease-in-out infinite alternate;
        }

        @keyframes moveBox {
            from {
                transform: translateX(-50px);
            }

            to {
                transform: translateX(50px);
            }
        }

        /* Bouncing animation */
        .ball {
            width: 70px;
            height: 70px;
            background-color: #e74c3c;
            border-radius: 50%;
            animation: bounce 1s ease-in-out infinite;
            animation-direction: alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100px);
            }
        }

        /* Color changing animation */
        .text {
            font-size: 25px;
            font-weight: bold;
            animation: changeColor 3s ease-in-out infinite;
            animation-iteration-count: infinite;
            animation-delay: 0.5s;
        }

        @keyframes changeColor {
            0% {
                color: blue;
            }

            50% {
                color: red;
            }

            100% {
                color: green;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation Showcase</h1>

    <main class="container">

        <div class="box move"></div>

        <div class="ball"></div>

        <div class="text">
            Color Changing Text
        </div>

    </main>

</body>
</html>
