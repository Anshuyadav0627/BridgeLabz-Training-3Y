<!DOCTYPE html>
<html>
<head>
    <title>Image Showcase</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 30px;
        }

        figure {
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px gray;
        }

        .image-box {
            position: relative;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Semi-transparent overlay */
        .image-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: 0.4s ease;
        }

        .image-box:hover img {
            transform: scale(1.1);
        }

        .image-box:hover::after {
            opacity: 1;
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Image Showcase</h1>

    <main class="gallery">

        <figure>
            <div class="image-box">
                <img src="image1.jpg" alt="Nature">
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="image2.jpg" alt="Mountain">
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="image3.jpg" alt="Beach">
            </div>
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="image4.jpg" alt="Forest">
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="image5.jpg" alt="City">
            </div>
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="image6.jpg" alt="Lake">
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

    </main>

</body>
</html>
