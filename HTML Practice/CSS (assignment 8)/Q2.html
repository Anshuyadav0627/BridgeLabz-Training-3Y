<!DOCTYPE html>
<html>
<head>
    <title>CSS Tooltip</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eeeeee;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            padding: 30px;
        }

        .container {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .tooltip-box {
            position: relative;
            background-color: #3498db;
            color: white;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #222;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease-in-out;
        }

        .tooltip-box:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body>

    <h1>CSS Tooltip Demonstration</h1>

    <main class="container">

        <div class="tooltip-box">
            Home
            <span class="tooltip">Go to Home</span>
        </div>

        <div class="tooltip-box">
            Profile
            <span class="tooltip">View Profile</span>
        </div>

        <div class="tooltip-box">
            Settings
            <span class="tooltip">Open Settings</span>
        </div>

        <div class="tooltip-box">
            Help
            <span class="tooltip">Get Help</span>
        </div>

    </main>

</body>
</html>
