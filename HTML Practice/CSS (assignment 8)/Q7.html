<!DOCTYPE html>
<html>
<head>
    <title>UI Components</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            max-width: 90%;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px gray;
        }

        h1 {
            text-align: center;
        }

        .component {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid gray;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: 3px solid #74b9ff;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <main class="card">

        <h1>Simple UI</h1>

        <section class="component">

            <input type="search" placeholder="Search here...">

            <select>
                <option>Select Category</option>
                <option>Technology</option>
                <option>Education</option>
                <option>Design</option>
            </select>

            <button>Search</button>

            <button>Submit</button>

        </section>

    </main>

</body>
</html>
