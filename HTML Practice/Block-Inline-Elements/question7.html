<!DOCTYPE html>
<html>
<head>
    <title>Conference Schedule</title>
</head>
<body>

    <header>
        <h1>Annual Technology Conference</h1>
    </header>

    <main>
        <table border="1">
            <caption>Conference Schedule</caption>

            <thead>
                <tr>
                    <th>Session</th>
                    <th>Time</th>
                    <th>Topic</th>
                    <th>Speaker</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td rowspan="2">Morning</td>
                    <td>9:00 AM</td>
                    <td>Artificial Intelligence</td>
                    <td>Dr. Sharma</td>
                </tr>
                <tr>
                    <td>11:00 AM</td>
                    <td>Cybersecurity</td>
                    <td>Mr. Kumar</td>
                </tr>

                <tr>
                    <td>Afternoon</td>
                    <td>2:00 PM</td>
                    <td>Cloud Computing</td>
                    <td>Ms. Priya</td>
                </tr>

                <tr>
                    <td>Evening</td>
                    <td>5:00 PM</td>
                    <td>Future of Technology</td>
                    <td>Dr. Verma</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">Conference ends at 6:00 PM</td>
                </tr>
            </tfoot>

        </table>
    </main>

</body>
</html>
