<!DOCTYPE html>
<html>
<head>
    <title>Selection Page</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Haryana</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Delhi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Red Fort</option>
        <option>India Gate</option>
        <option>Gateway of India</option>
    </select>

    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is Taj Mahal.
    </p>

</body>
</html>
