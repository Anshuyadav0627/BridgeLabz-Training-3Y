<!DOCTYPE html>
<html>
<head>
    <title>Filter Comparison</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
            padding: 25px;
        }

        .comparison {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 30px;
        }

        figure {
            width: 45%;
            margin: 0;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 12px gray;
            text-align: center;
        }

        img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .filtered {
            filter: brightness(60%);
            transition: filter 0.5s ease;
        }

        .filtered:hover {
            filter: none;
        }

        figcaption {
            padding: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
                align-items: center;
            }

            figure {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Before and After Filter Comparison</h1>

    <main class="comparison">

        <figure>
            <img src="original.jpg" alt="Original Image">
            <figcaption>Before - Original Image</figcaption>
        </figure>

        <figure>
            <img class="filtered" src="original.jpg" alt="Filtered Image">
            <figcaption>After - Brightness Filter</figcaption>
        </figure>

    </main>

</body>
</html>
