<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Filter Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 25px;
        }

        figure {
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 12px gray;
        }

        img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: filter 0.5s ease;
        }

        /* Different filters */
        .blur {
            filter: blur(3px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .sepia {
            filter: sepia(100%);
        }

        .brightness {
            filter: brightness(60%);
        }

        .contrast {
            filter: contrast(180%);
        }

        .hue {
            filter: hue-rotate(90deg);
        }

        /* Remove filter on hover */
        img:hover {
            filter: none;
        }

        figcaption {
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main class="gallery">

        <figure>
            <img class="blur" src="image1.jpg" alt="Nature">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="image2.jpg" alt="Mountain">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="image3.jpg" alt="Beach">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="image4.jpg" alt="Forest">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="image5.jpg" alt="City">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img class="hue" src="image6.jpg" alt="Lake">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>

    </main>

</body>
</html>
