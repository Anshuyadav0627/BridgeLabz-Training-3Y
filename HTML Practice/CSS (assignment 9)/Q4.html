<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        section {
            max-width: 900px;
            margin: auto;
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 3rem);
            margin-bottom: 25px;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            line-height: 1.7;
            color: #444;
        }

        @media (max-width: 700px) {
            section {
                padding: 35px 20px;
            }

            p {
                line-height: 1.9;
            }

            h1 {
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <main>

        <section>

            <h1>Responsive Typography</h1>

            <p>
                Responsive typography allows text to automatically adjust
                according to the size of the screen. The CSS clamp()
                function provides a minimum, flexible, and maximum font size.
            </p>

        </section>

    </main>

</body>
</html>
