<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            min-height: 150px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            color: #1e3a5f;
        }

        @media (max-width: 800px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Products</h1>

    <div class="products">

        <div class="card">
            <h2>Laptop</h2>
            <p>₹50,000</p>
        </div>

        <div class="card">
            <h2>Mobile</h2>
            <p>₹20,000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p>₹2,000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p>₹25,000</p>
        </div>

        <div class="card">
            <h2>Watch</h2>
            <p>₹3,000</p>
        </div>

        <div class="card">
            <h2>Speaker</h2>
            <p>₹2,500</p>
        </div>

    </div>

</body>
</html>
