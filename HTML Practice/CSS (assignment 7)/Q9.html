<!DOCTYPE html>
<html>
<head>
    <title>Outline and Focus Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eeeeee;
        }

        form {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            outline: 3px solid blue;
            outline-offset: 3px;
        }

        textarea:focus {
            outline: 3px dashed green;
            outline-offset: 4px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
        }
    </style>
</head>

<body>

    <form>

        <h1>Contact Form</h1>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea rows="5" placeholder="Write your message"></textarea>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
