<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Selectors</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid blue;
            padding: 10px;
        }

        /* Attribute selector for links starting with https */
        a[href^="https"] {
            color: green;
            font-weight: bold;
        }

        /* Descendant selector */
        .list li {
            padding: 8px;
        }

        /* Child combinator */
        .list > li {
            background-color: #e8f6ff;
        }

        /* Adjacent sibling combinator */
        h2 + p {
            color: purple;
        }

        /* General sibling combinator */
        h2 ~ ul {
            border: 2px solid orange;
            padding: 20px;
        }

        /* Pseudo-class :hover */
        li:hover {
            background-color: yellow;
        }

        /* Pseudo-class :focus */
        input:focus {
            outline: 3px solid orange;
        }

        /* Pseudo-class :nth-child() */
        .list li:nth-child(2) {
            color: red;
            font-weight: bold;
        }

        /* Pseudo-element ::before */
        .list li::before {
            content: "✓ ";
        }

        /* Pseudo-element ::after */
        h1::after {
            content: " ★";
            color: orange;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Advanced CSS Selectors</h1>

        <h2>Items</h2>

        <p>Different CSS selectors are used below.</p>

        <ul class="list">
            <li>HTML</li>
            <li>CSS</li>
            <li>Java</li>
            <li>Python</li>
        </ul>

        <h2>Input</h2>

        <input type="text" placeholder="Enter your name">

        <p>
            <a href="https://www.google.com">Visit Secure Link</a>
        </p>

    </main>

</body>
</html>
