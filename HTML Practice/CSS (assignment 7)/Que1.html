<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #1e3a5f;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 70vh;
            padding: 30px;
        }

        .about,
        .image {
            width: 40%;
            padding: 30px;
            text-align: center;
        }

        .image img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
        }

        footer {
            text-align: center;
            background-color: #1e3a5f;
            color: white;
            padding: 20px;
        }

        @media (max-width: 700px) {
            header,
            main {
                flex-direction: column;
            }

            .about,
            .image {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Anshu Yadav</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section class="about">
            <h2>About Me</h2>
            <p>
                I am a Computer Science student. I like learning
                programming and new technologies.
            </p>
        </section>

        <section class="image">
            <img src="profile.jpg" alt="My Photo">
        </section>

    </main>

    <footer>
        <p>© 2026 Anshu Yadav</p>
    </footer>

</body>
</html>
