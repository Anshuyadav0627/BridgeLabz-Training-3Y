<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .margin {
            background-color: #f8c471;
            padding: 30px;
        }

        .border {
            border: 15px solid #e67e22;
            background-color: #82e0aa;
            padding: 25px;
        }

        .padding {
            background-color: #85c1e9;
            padding: 30px;
        }

        .content {
            background-color: #f5b7b1;
            width: 220px;
            padding: 20px;
            text-align: center;
        }

        .text {
            max-width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            text-align: center;
        }

        .border-box {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 10px solid blue;
            box-sizing: border-box;
            margin: 30px auto;
            text-align: center;
            background-color: #d6eaf8;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <main>

        <section class="container">

            <div class="margin">

                <div class="border">

                    <div class="padding">

                        <div class="content">
                            Content
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <div class="text">
            <p><strong>Content:</strong> Actual information inside the box.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Border:</strong> Line surrounding padding.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
        </div>

        <div class="border-box">
            box-sizing: border-box
        </div>

    </main>

</body>
</html>
