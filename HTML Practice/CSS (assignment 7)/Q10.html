<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #222;
        }

        nav {
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            border-right: 1px solid gray;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #3498db;
            transform: translateY(-3px);
        }

        nav a.active {
            background-color: #e67e22;
            border-bottom: 4px solid white;
        }

        main {
            flex: 1;
            text-align: center;
            padding: 80px 20px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
            }

            nav a {
                text-align: center;
                border-bottom: 1px solid gray;
                border-right: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main>

        <h1>Welcome to My Website</h1>
        <p>Hover over the navigation links to see the transition effect.</p>

    </main>

    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

</body>
</html>
