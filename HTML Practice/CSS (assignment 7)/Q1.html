<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 180px;
            background-color: white;
            transition: border-color 0.4s ease;
        }

        .solid {
            border: 5px solid blue;
            padding: 20px;
        }

        .dashed {
            border: 5px dashed green;
            padding: 30px;
        }

        .double {
            border: 8px double red;
            padding: 15px;
        }

        .groove {
            border: 8px groove purple;
            padding: 25px;
        }

        .rounded {
            border: 5px solid orange;
            border-radius: 25px;
            padding: 20px;
        }

        .box:hover {
            border-color: black;
        }
    </style>
</head>

<body>

    <h1>Borders and Padding Demonstration</h1>

    <main class="container">

        <div class="box solid">
            <h3>Solid Border</h3>
            <p>Padding: 20px</p>
        </div>

        <div class="box dashed">
            <h3>Dashed Border</h3>
            <p>Padding: 30px</p>
        </div>

        <div class="box double">
            <h3>Double Border</h3>
            <p>Padding: 15px</p>
        </div>

        <div class="box groove">
            <h3>Groove Border</h3>
            <p>Padding: 25px</p>
        </div>

        <div class="box rounded">
            <h3>Rounded Border</h3>
            <p>Uses border-radius</p>
        </div>

    </main>

</body>
</html>
